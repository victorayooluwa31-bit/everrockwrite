[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/inbox/*"
  to = "/.netlify/functions/inbox/:splat"
  status = 200

[[redirects]]
  from = "/api/inbox"
  to = "/.netlify/functions/inbox/messages"
  status = 200
