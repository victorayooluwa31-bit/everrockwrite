backend:
  name: github
  repo: Everrock Write
  branch: main

media_folder: static/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Summary, name: summary, widget: text, hint: "One or two sentences shown on the home page." }
      - { label: Cover image, name: image, widget: image, required: false }
      - { label: Draft (hide from site), name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    editor:
      preview: false
    files:
      - label: About
        name: about
        file: content/pages/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
