<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EverRock Write · Messages</title><style>
:root{font-family:system-ui,sans-serif;color:#101d34;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:4rem auto;padding:1.5rem}h1{margin:0 0 .5rem}p{color:#596273}.panel,.message{background:white;border:1px solid #dce1e8;border-radius:10px;padding:1.25rem;margin:1rem 0}input,button{font:inherit;padding:.8rem;border:1px solid #cbd2dc;border-radius:6px}input{width:100%;margin:.5rem 0 1rem}button{background:#101d34;color:white;border:0;cursor:pointer}.secondary{background:#e9edf3;color:#101d34}.error{color:#a12626}.meta{font-size:.9rem;color:#687386}.message p{white-space:pre-wrap;overflow-wrap:anywhere;color:#101d34}.top{display:flex;justify-content:space-between;align-items:center;gap:1rem}a{color:#101d34}@media(max-width:600px){.wrap{margin:1rem auto}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Contact messages</h1><p>Private EverRock Write inbox</p></div><a href="/admin/">Back to CMS</a></div><section id="login" class="panel"><h2>Sign in</h2><form id="loginForm"><label for="password">Inbox password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form><p id="loginStatus" role="status"></p></section><section id="inbox" hidden><div class="top"><h2>Received messages</h2><button id="logout" class="secondary">Sign out</button></div><p id="status" role="status"></p><div id="messages"></div></section></main><script>
const $=id=>document.getElementById(id), endpoint='/api/inbox';
async function request(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed');return data}
function showInbox(){ $('login').hidden=true;$('inbox').hidden=false;load()}
function showLogin(){ $('login').hidden=false;$('inbox').hidden=true}
async function load(){try{const data=await request(endpoint+'/messages');$('status').textContent=data.messages.length+' message(s)';$('messages').replaceChildren();if(!data.messages.length){$('messages').textContent='No messages yet.';return}for(const m of data.messages){const card=document.createElement('article');card.className='message';const h=document.createElement('h3');h.textContent=m.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=m.email+' · '+new Date(m.receivedAt).toLocaleString();const body=document.createElement('p');body.textContent=m.message;const del=document.createElement('button');del.className='secondary';del.textContent='Delete';del.addEventListener('click',async()=>{if(!confirm('Delete this message?'))return;try{await request(endpoint+'/messages?id='+encodeURIComponent(m.id),{method:'DELETE'});load()}catch(e){$('status').textContent=e.message}});card.append(h,meta,body,del);$('messages').append(card)}}catch(e){$('status').textContent=e.message;if(e.message.includes('sign in'))showLogin()}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginStatus').textContent='';try{await request(endpoint+'/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';showInbox()}catch(e){$('loginStatus').className='error';$('loginStatus').textContent=e.message}});
$('logout').addEventListener('click',async()=>{try{await request(endpoint+'/logout',{method:'POST'})}finally{showLogin()}});
request(endpoint+'/messages').then(()=>showInbox()).catch(()=>showLogin());
</script></body></html>
